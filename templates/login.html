{% extends "base.html" %}

{% block title %}Login | AEGIS AI Security{% endblock %}

{% block content %}
<div style="min-height: 80vh; display: flex; align-items: center; justify-content: center;">
    <div style="width: 100%; max-width: 420px; background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 36px 32px; box-shadow: var(--shadow-card); position: relative; overflow: hidden;">
        <div style="position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, #1f6feb, #238636, #388bfd);"></div>

        <div style="text-align: center; margin-bottom: 28px;">
            <div style="width: 54px; height: 54px; margin: 0 auto 12px auto; background: linear-gradient(135deg, #1f6feb, #238636); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 26px; box-shadow: 0 0 15px rgba(31, 111, 235, 0.4);">
                🛡️
            </div>
            <h2 style="font-size: 20px; font-weight: 700; color: #fff; letter-spacing: 0.5px;">AEGIS AI SECURITY</h2>
            <p style="font-size: 12.5px; color: var(--text-secondary); margin-top: 4px;">Premises Real-Time Monitoring Portal</p>
        </div>

        <form method="POST" action="{{ url_for('auth.login') }}">
            <div class="form-group">
                <label class="form-label" for="username">Username</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="Enter your username" required autofocus autocomplete="username">
            </div>

            <div class="form-group" style="margin-bottom: 24px;">
                <label class="form-label" for="password">Password</label>
                <div style="position: relative;">
                    <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required autocomplete="current-password">
                    <button type="button" onclick="togglePasswordVisibility()" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 14px;">
                        👁️
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-ctrl btn-primary" style="width: 100%; padding: 11px; font-size: 14px; font-weight: 600; justify-content: center; border-radius: 6px;">
                Sign In to Security Console
            </button>
        </form>

        <div style="margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--border-color); text-align: center; font-size: 12px; color: var(--text-muted);">
            <p>Default credentials: <span style="font-family: var(--font-mono); color: #58a6ff;">admin</span> / <span style="font-family: var(--font-mono); color: #58a6ff;">Admin@123</span></p>
            <p style="margin-top: 4px;">Run <span style="font-family: var(--font-mono); color: var(--accent-cyan);">python scripts/create_admin.py</span> to change</p>
        </div>
    </div>
</div>

<script>
function togglePasswordVisibility() {
    const input = document.getElementById("password");
    if (input.type === "password") {
        input.type = "text";
    } else {
        input.type = "password";
    }
}
</script>
{% endblock %}
